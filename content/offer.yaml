who:
  heading: "Is this you?"
  items:   # draft: the short titles come from Julia's slides
    - title: "Stretched too thin"
      text: "You're doing well, maybe better than ever on paper, but you're stretched across too many directions to think straight about what's actually next."
    - title: "Ready for bigger"
      text: "You're ready for a bigger role, a bigger bet, a bigger version of what you're already doing. You just haven't built the bridge to get there yet."
    - title: "The best-kept secret"
      text: "People respect what you do, but somehow your real value still isn't fully recognized, and you're tired of being the best-kept secret in the room."
    - title: "A plan for everyone but you"
      text: "You can build a plan for anyone: your team, your clients, your family. Building one for yourself, without it costing you everything else, is the part you haven't cracked."

