closing:
  text: "There's something about January: a year that hasn't been written yet, a clean page to actually start from. Imagine walking into it already holding a real plan, built alongside other women doing the same thing, instead of figuring it out alone in your head again. This is your chance to know, from day one, exactly how you're going to bring this year's ambition to life."

