hero:
  title: "Own Your Mosaic of Life"
  subtitle: "Build a Roadmap for Your Next Ambition"
  tagline: "Clarify your next professional ambition, build a strategy that fits your life, and make your value more visible."
  name: "Julia Krylova"
  positioning: "Strategic Mentor for Ambitious Women Leaders at Their Next Big Chapter"
  paragraphs:
    - "You've built a career and achieved a lot. But right now, you may feel stretched in too many directions, uncertain about your next step, or unsure how to make your value more visible."
    - "In this program, you'll take a fresh look at the bigger picture, identify what may be holding you back, and build a practical roadmap for moving forward."
    - "An eight-week online group program for women leaders who are ready for their next professional ambition but aren't sure how to make it happen."
