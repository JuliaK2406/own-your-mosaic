  heading: "The Mosaic of Life Method™"
  intro: "We begin with the Mosaic of Life diagnostic, a helicopter view of where you are today: what's working well, where you feel stretched, and what may be holding you back. Then, over eight weeks, we work through three levels."
  start_label: "Mosaic of Life diagnostic"
  start_weeks: "Week 1"
  finish_label: "Your Next Chapter Roadmap"
  finish_weeks: "Week 8"
  levels:
