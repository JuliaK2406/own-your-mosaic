proof:   # the text of Julia's document (16 Nov)
  heading: "Meet Your Mentor"
  paragraphs:
    - "I'm Julia Krylova, a strategic mentor, entrepreneur, speaker, and author of *Mosaic of Life*."
    - "For over 25 years, I built my career in international entertainment and creative production, delivering more than 60 projects across 35+ countries, leading teams of up to 250 people, and working directly with legendary figures such as Ennio Morricone and Priscilla Presley."
    - "After my divorce in 2017, I found myself rebuilding many parts of my life: my career, relationships, interests, and social circle. Piece by piece, I began creating a new picture, discovering along the way how deeply interconnected everything was. This experience became the foundation of my Mosaic of Life philosophy."
    - "In 2019, I discovered a new passion for teaching, speaking, and mentoring. What started alongside my production career gradually grew into a new professional direction. In 2025, I decided to dedicate myself fully to this work."
    - "Today, I work with ambitious women navigating career changes, stepping into bigger leadership roles, and building their own businesses. I've seen how the right perspective, practical guidance, and a little courage can help someone move from feeling stuck to making real progress."
    - "As a mother, entrepreneur, and woman who has reinvented herself more than once, I know that ambition doesn't exist separately from the rest of our lives. And that's what makes this work so meaningful to me."
  mentoring_photo: julia-krylova-session.jpg
  mentoring_photo_alt: "Julia Krylova laughing as she leads a session, with women on a sofa listening and one taking notes"
  photo: julia-krylova.jpg
  photo_alt: "Julia Krylova in a blue dress, arms crossed, looking at the camera"
  group_photo: julia-krylova-group.jpg
  group_photo_alt: "Julia Krylova in a white suit in the middle of a large group of women raising bouquets of flowers"

approach:   # the text of Julia's document (16 Nov), in place of "What producing gave me"
  heading: "What makes my approach different"
  items:
    - title: "A Producer's Perspective"
      text: "I approach professional ambitions through a producer's lens: looking at the big picture, the people involved, available resources, competing priorities, and what it takes to make things happen."
    - title: "One Integrated Method"
      text: "Rather than treating career strategy, personal circumstances, and professional communication as separate problems, I bring them together through the Mosaic of Life Method™."
    - title: "Practical Mentoring With Genuine Care"
      text: "I don't just ask questions. I share real-world experience, offer ideas and recommendations, challenge assumptions, and help clients find solutions they can use. I genuinely care about their progress."

