proof:
  heading: "Meet your mentor"
  stats:   # draft: from Julia's slides
    - { value: "15", label: "The team I grew, from a production company I co-built from the ground up" }
    - { value: "51%", label: "Acquisition of the company by Sony" }
  paragraphs:
    - "My approach doesn't come from theory. It comes from building and scaling complex, high-pressure ventures myself. I co-built a production company from the ground up, grew it to a team of 15 (including working alongside names like Ennio Morricone), eventually leading to a 51% acquisition by Sony. I know what it actually takes to turn an ambitious idea into a working, resourced, resilient system, not just a plan on paper."
    - "And I know this from the inside, not only from a boardroom. I'm a mother. I know what it actually takes to hold a real ambition while still showing up for your children and your partner, and over the years, I've learned how to navigate that balance, not just talk about it."
  strengths_intro: "What producing gave me, and what I bring directly into this work:"
  strengths: ["Vision", "Strategy", "Creative thinking", "Resourcefulness", "Strategic focus"]
  mentoring: >-
    Since then, I've mentored ambitious women across industries (concertmasters and
    conductors, producers on major international productions, founders building their
    own ventures), helping them do exactly what this program is built to do: take
    "too much, too fast, too unclear" and turn it into a concrete, workable action plan.
    The Mosaic of Life Method™ is the direct result of that experience, mine and theirs.
  shift_visual:   # draft: a picture of the sentence above, words taken from it
    from: ["too much", "too fast", "too unclear"]
    to: "a concrete, workable action plan"
  mentoring_photo: julia-krylova-session.jpg
  mentoring_photo_alt: "Julia Krylova laughing as she leads a session, with women on a sofa listening and one taking notes"
  photo: julia-krylova.jpg
  photo_alt: "Julia Krylova in a blue dress, arms crossed, looking at the camera"
  quotes_heading: "In their own words"
  quotes:   # draft: placeholders until Julia sends her own quotes
