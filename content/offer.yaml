faq:   # slide 10, in the order of its two columns (left column first)
  label: "Frequently asked questions"
  heading: "Good to know"
  items:
    - q: "Is this for corporate women or entrepreneurs?"
      a: "Both. What connects the group is ambition, not job title. Your next step can be a bigger role, a growing business, or a better balance between ambition and life."
    - q: "What if I miss a session or fall behind?"
      a: "Life happens. Every session is recorded, and you keep access to the recordings and the tools library for one month after the program."
    - q: "How much time does it take?"
      a: "One 90-minute live session a week, on a weekday evening. The rest you apply in your own time, in your own life."
    - q: "Can my employer pay?"
      a: "Yes. You receive an invoice you can submit to your employer or L&D budget."
    - q: "Is this coaching or therapy?"
      a: "Neither. It's mentoring: practical tools, a clear structure, and guidance from someone who has done it herself."
    - q: "What happens after week 8?"
      a: "You leave with your Next Chapter Roadmap. One month later, we meet again as a group to check progress. And you're invited to the Mosaic of Life alumni club."

