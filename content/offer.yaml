    - { from: "holding an ambition alongside an overloaded life", to: "having a practical roadmap that takes both into account" }

problem:
  statement: "The ambition is real."
  statement_more: "What's missing is a playbook for deciding what to focus on and how to move forward."

promise:
  heading: "Your Next Chapter Roadmap"
  paragraphs:
    - "By the end of the program, you'll have a personalized roadmap for pursuing your next professional ambition, one that takes your career or business, priorities, energy, and personal life into account. You'll also have tools to help you put the plan into action."
  diagram:   # draft: labels taken word for word from the paragraph above
    inputs_label: "Takes into account"
    inputs: ["Career or business", "Priorities", "Energy", "Personal life"]
    result: "Your Next Chapter Roadmap"
  outcomes_intro: "The program will enable you to:"
  outcomes:
    - "Clarify professional ambition you want to focus on, whether that's a bigger role, a new direction or growing your business."
    - "Decide which opportunities and priorities need your attention now, and which can wait."
    - "Identify what may need to shift in your workload, routines or support to make room for this ambition."
    - "Plan your next steps, ready to put into action."

process:
  heading: "The Mosaic of Life Method™"
  intro: "We begin with the Mosaic of Life diagnostic, a helicopter view of where you are today: what's working well, where you feel stretched, and what may be holding you back."
  levels_intro: "Then, over eight weeks, we work through three levels:"
  start_label: "Mosaic of Life diagnostic"
  start_weeks: "Week 1"
  finish_label: "Your Next Chapter Roadmap"
  finish_weeks: "Week 8"
  levels:
    - name: "Life Foundation"
      weeks: "Weeks 2-3"
      text: "Look at your time, energy and support systems. Identify what needs to change so your life can better support your ambitions."
    - name: "Professional Strategy"
      weeks: "Weeks 4-5"
      text: "Clarify your professional goals, explore opportunities and identify the steps that can move you closer to your ambition."
    - name: "Visibility & Influence"
      weeks: "Weeks 6-7"
      text: "Explore how to communicate your value, strengthen your presence and influence, and become more visible at work."

